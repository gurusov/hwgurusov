services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GREETING: ${GREETING:-Hello from Docker!}
      STORAGE: ${STORAGE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: 8000
    ports:
      - "${APP_PORT:-8080}:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  redis_data:
